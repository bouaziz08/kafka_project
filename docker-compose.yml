services:
  kafka:
    image: confluentinc/cp-kafka:7.8.3
    container_name: kafka
    ports:
      - "9092:29092"

    environment:
      KAFKA_KRAFT_MODE: 'true'

      CLUSTER_ID: '1L6g7nGhU-eAKfL--X25wo'
      KAFKA_NODE_ID: 1

      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9092,EXTERNAL://0.0.0.0:29092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs

    volumes:
      - kafka_kraft:/var/lib/kafka/data

  db:
    image: postgres:16-alpine
    container_name: my_postgres_db
    environment:
      POSTGRES_DB: kafka_project
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: azerty@147
    volumes:
      - ./data/db:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: always

  order_producer:
    build: ./order_producer
    depends_on:
      - kafka
    ports:
      - "8000:8000"
      - "8012:8012"
    environment:
      KAFKA_BROKER: kafka:9092

  payment_producer:
    build: ./payment_producer
    depends_on:
      kafka:
        condition: service_started
      db:
        condition: service_healthy
      order_consumer:
        condition: service_healthy
    ports:
      - "8001:8000"
      - "8011:8011"
    environment:
      KAFKA_BROKER: kafka:9092
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: kafka_project
      DB_USER: admin
      DB_PASSWORD: azerty@147

  order_consumer:
    build: ./order_consumer
    depends_on:
      kafka:
        condition: service_started
      db:
        condition: service_healthy
    ports:
      - "8020:8020"
    environment:
      KAFKA_BROKER: kafka:9092
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: kafka_project
      DB_USER: admin
      DB_PASSWORD: azerty@147
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import os, psycopg2; conn=psycopg2.connect(host=os.getenv('DB_HOST'), port=os.getenv('DB_PORT'), dbname=os.getenv('DB_NAME'), user=os.getenv('DB_USER'), password=os.getenv('DB_PASSWORD')); cursor=conn.cursor(); cursor.execute(\"SELECT to_regclass('public.orders')\"); assert cursor.fetchone()[0] is not None; cursor.close(); conn.close()"
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  payment_consumer:
    build: ./payment_consumer
    depends_on:
      kafka:
        condition: service_started
      db:
        condition: service_healthy
      order_consumer:
        condition: service_healthy
    ports:
      - "8021:8021"
    environment:
      KAFKA_BROKER: kafka:9092
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: kafka_project
      DB_USER: admin
      DB_PASSWORD: azerty@147

  prometheus:
    image: prom/prometheus
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana
    ports:
      - "3001:3000"

volumes:
  kafka_kraft: